<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <clipPath id="safari-clip">
      <circle cx="150" cy="150" r="136" />
    </clipPath>
  </defs>
  <g clip-path="url(#safari-clip)">
    <!-- Base dark olive green dome -->
    <rect x="0" y="0" width="300" height="150" fill="#24562B" />
    <!-- Bottom pale lavender-white hemisphere -->
    <rect x="0" y="150" width="300" height="150" fill="#ECEAF4" />

    <!-- Authentic military camouflage organic blotches -->
    <!-- Large khaki-tan blotches -->
    <path d="M 30 50 C 50 20, 100 15, 120 45 C 130 60, 110 85, 80 85 C 50 85, 20 70, 30 50 Z" fill="#B8A956" />
    <path d="M 180 20 C 220 15, 250 40, 240 70 C 230 95, 190 90, 175 75 C 160 60, 160 30, 180 20 Z" fill="#B8A956" />
    <path d="M 10 110 C 25 90, 70 85, 90 105 C 105 120, 85 142, 50 142 C 20 142, 5 130, 10 110 Z" fill="#B8A956" />
    <path d="M 210 105 C 230 85, 275 90, 285 115 C 295 135, 270 142, 240 142 C 210 142, 195 120, 210 105 Z" fill="#B8A956" />
    <path d="M 125 110 C 145 95, 175 100, 180 120 C 185 138, 160 142, 135 142 C 115 142, 110 125, 125 110 Z" fill="#B8A956" />

    <!-- Deep dark forest green patches -->
    <path d="M 70 40 C 90 25, 130 30, 135 55 C 140 75, 115 85, 95 80 C 75 75, 60 55, 70 40 Z" fill="#143818" />
    <path d="M 220 35 C 250 40, 270 65, 260 90 C 250 110, 225 105, 215 90 C 205 75, 200 50, 220 35 Z" fill="#143818" />
    <path d="M 60 100 C 80 85, 115 90, 120 115 C 125 135, 100 142, 75 142 C 55 142, 50 120, 60 100 Z" fill="#143818" />
    <path d="M 160 65 C 180 50, 210 55, 215 75 C 220 95, 195 105, 175 100 C 155 95, 150 75, 160 65 Z" fill="#143818" />

    <!-- Earthy olive-brown patches -->
    <path d="M 120 20 C 140 10, 170 15, 175 35 C 180 55, 155 65, 135 60 C 115 55, 110 35, 120 20 Z" fill="#7D6B30" />
    <path d="M 140 70 C 160 60, 185 65, 190 85 C 195 100, 170 110, 150 105 C 130 100, 125 80, 140 70 Z" fill="#7D6B30" />
    <path d="M 260 110 C 275 95, 295 100, 298 120 C 300 135, 285 142, 270 142 C 255 142, 250 125, 260 110 Z" fill="#7D6B30" />

    <!-- Dividing equator band -->
    <rect x="0" y="142" width="300" height="16" fill="#222224" />
  </g>

  <!-- Outer sphere boundary border -->
  <circle cx="150" cy="150" r="136" fill="none" stroke="#222224" stroke-width="14" />

  <!-- Center button -->
  <circle cx="150" cy="150" r="40" fill="#222224" />
  <circle cx="150" cy="150" r="26" fill="#FFFFFF" />
  <circle cx="150" cy="150" r="16" fill="none" stroke="#222224" stroke-width="4" />
</svg>
