<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <clipPath id="great-clip">
      <circle cx="150" cy="150" r="136" />
    </clipPath>
  </defs>
  <g clip-path="url(#great-clip)">
    <!-- Royal blue upper dome -->
    <rect x="0" y="0" width="300" height="150" fill="#1872C4" />
    <!-- Pale lavender-white lower hemisphere -->
    <rect x="0" y="150" width="300" height="150" fill="#ECEAF2" />

    <!-- Big chunky red tabs on upper sides (stopping well short of the center line) -->
    <!-- Left chunky red tab -->
    <path d="M 120 22 C 85 36 45 68 32 108 C 30 114 34 118 40 118 L 84 118 C 88 118 92 114 90 108 C 82 82 92 56 122 32 Z" fill="#E53322" />

    <!-- Right chunky red tab -->
    <path d="M 180 22 C 215 36 255 68 268 108 C 270 114 266 118 260 118 L 216 118 C 212 118 208 114 210 108 C 218 82 208 56 178 32 Z" fill="#E53322" />

    <!-- Horizontal equator dividing band -->
    <rect x="0" y="142" width="300" height="16" fill="#222224" />
  </g>

  <!-- Outer sphere boundary border -->
  <circle cx="150" cy="150" r="136" fill="none" stroke="#222224" stroke-width="14" />

  <!-- Center button -->
  <circle cx="150" cy="150" r="40" fill="#222224" />
  <circle cx="150" cy="150" r="26" fill="#FFFFFF" />
  <circle cx="150" cy="150" r="16" fill="none" stroke="#222224" stroke-width="4" />
</svg>
